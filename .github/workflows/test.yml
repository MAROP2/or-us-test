name: OR region test
on:
  workflow_dispatch:
    inputs:
      req:
        description: 'request body json'
        required: true
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: ip
        run: curl -s https://ipinfo.io/json | head -c 300
      - name: call
        env:
          KEY: ${{ secrets.OR_KEY }}
        run: |
          curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '${{ github.event.inputs.req }}'
