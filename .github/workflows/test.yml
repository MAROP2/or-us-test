name: OR region test
on:
  workflow_dispatch:
    inputs:
      key:
        required: true
      req:
        required: true
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: ip
        run: curl -s https://ipinfo.io/json | head -c 200
      - name: call
        run: |
          curl -s -X POST https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer ${{ github.event.inputs.key }}" \
            -H "Content-Type: application/json" \
            -d '${{ github.event.inputs.req }}'
